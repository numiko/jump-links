<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumplinks</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-10">

    <section class="min-h-[20vh] flex items-center justify-center bg-purple-100 rounded-lg p-8 mb-8">
      <h2 class="text-2xl font-bold mb-4">Section before JumpLinks</h2>
    </section>

    <!-- Regular navigation -->
    <nav data-js-jumplinks-trigger-start class="bg-gray-100 py-4 mb-8 rounded-lg ">
      <div class="container mx-auto px-4">
        <ul class="flex justify-center space-x-6">
          <li><a href="#section1" class="font-bold text-blue-600 hover:text-black">Section 1</a></li>
          <li><a href="#section2" class="font-bold text-blue-600 hover:text-black">Section 2</a></li>
          <li><a href="#section3" class="font-bold text-blue-600 hover:text-black">Section 3</a></li>
          <li><a href="#section4" class="font-bold text-blue-600 hover:text-black">Section 4</a></li>
        </ul>
      </div>
    </nav>

    <!-- Fixed navigation (hidden by default via Tailwind classes) -->
    <nav data-js-jumplinks class="fixed top-0 left-0 right-0 bg-indigo-300 py-4 transform -translate-y-full transition-transform duration-300">
      <!-- Progress Bar - make sure to use the same CSS custom property name as your config -->
      <div class="bg-indigo-200 absolute bottom-0 left-0 right-0">
        <span
          data-js-jumplinks-progress-bar
          style="transform: translateX(calc(-100% + var(--jumplinks-progress, 50%)))"
          class="w-full block will-change-transform transform duration-75 -translate-x-full bg-indigo-800 h-1"
        >
        </span>
      </div>

      <div class="container mx-auto px-4">

        <details>
          <summary class="cursor-pointer font-bold">Currently viewing: <span data-js-jumplinks-label></span></summary>
          <ul class="flex justify-center space-x-6">
            <li><a href="#section1" class="font-bold text-indigo-900 hover:text-black">Section 1</a></li>
            <li><a href="#section2" class="font-bold text-indigo-900 hover:text-black">Section 2</a></li>
            <li><a href="#section3" class="font-bold text-indigo-900 hover:text-black">Section 3</a></li>
            <li><a href="#section4" class="font-bold text-indigo-900 hover:text-black">Section 4</a></li>
          </ul>
        </details>

      </div>
    </nav>

    <!-- Content sections -->
    <div data-js-jumplinks-trigger-end id="content" class="mb-8">
      <section id="section1" class="min-h-screen flex items-center justify-center bg-green-100 rounded-lg p-8 mb-8">
        <h2 class="text-2xl font-bold mb-4">Section 1</h2>
      </section>

      <section id="section2" class="min-h-screen flex items-center justify-center bg-green-100 rounded-lg p-8 mb-8">
        <h2 class="text-2xl font-bold mb-4">Section 2</h2>
      </section>

      <section id="section3" class="min-h-screen flex items-center justify-center bg-green-100 rounded-lg p-8 mb-8">
        <h2 class="text-2xl font-bold mb-4">Section 3</h2>
      </section>

      <section id="section4" class="min-h-screen flex items-center justify-center bg-green-100 rounded-lg p-8">
        <h2 class="text-2xl font-bold mb-4">Section 4</h2>
      </section>
    </div>

    <section class="min-h-screen flex items-center justify-center bg-purple-100 rounded-lg p-8 mb-8">
      <h2 class="text-2xl font-bold mb-4">Section after jumplinks</h2>
    </section>


    <script type="module" src="./src/main.js"></script>
  </body>
</html>
